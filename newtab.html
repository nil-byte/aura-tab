<!DOCTYPE html>
<html lang="zh-CN" data-i18n-title="pageTitle" style="background:#1a1a2e;">

<head>
    <meta charset="UTF-8">
    <title>New Tab</title>
    <script src="scripts/boot/first-paint.js"></script>
    <link rel="stylesheet" href="styles/bundle.css">
    <link rel="stylesheet" href="styles/photos.css">
</head>

<body>
    <a href="#main-content" class="skip-link" data-i18n="skipToMain"></a>

    <div class="light-orb" aria-hidden="true"></div>
    <div class="ui-grain" aria-hidden="true"></div>

    <div class="layout-container" id="main-content">
        <div class="clock-container">
            <div class="clock-wrapper">
                <div class="clock" id="clock">00:00</div>
                <div class="date" id="date">Monday, January 01</div>
            </div>
        </div>
        <div class="search-container" id="searchContainer">
            <div class="search-engine-wrapper">
                <button class="search-engine-btn" id="searchEngineBtn" data-i18n="ariaSwitchEngine"
                    data-i18n-attr="aria-label" aria-label="" tabindex="-1">
                    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    </svg>
                </button>
            </div>
            <input type="text" class="search-input" id="searchInput" data-i18n="searchPlaceholder" placeholder=""
                autofocus>
        </div>
    </div>
    <div class="quicklinks-container" id="quicklinksContainer" data-style="medium">
        <button class="launchpad-btn" id="launchpadBtn" data-i18n="ariaLaunchpad" data-i18n-attr="aria-label"
            aria-label="" tabindex="-1">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <rect x="2.5" y="2.5" width="8.5" height="8.5" rx="1.5" />
                <rect x="13" y="2.5" width="8.5" height="8.5" rx="1.5" />
                <rect x="2.5" y="13" width="8.5" height="8.5" rx="1.5" />
                <rect x="13" y="13" width="8.5" height="8.5" rx="1.5" />
            </svg>
        </button>
        <div class="dock-separator" aria-hidden="true"></div>
        <ul class="quicklinks-list" id="quicklinksList"></ul>
        <div class="dock-separator" aria-hidden="true"></div>
        <div class="quicklinks-add-wrapper">
            <button class="quicklinks-add-btn" id="quicklinksAddBtn" data-i18n="ariaAddLink" data-i18n-attr="aria-label"
                aria-label="" tabindex="-1">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
            </button>
        </div>
    </div>

    <div class="launchpad-overlay" id="launchpadOverlay" data-modal="true" role="dialog" aria-modal="true"
        data-i18n="ariaLaunchpad" data-i18n-attr="aria-label" aria-label="" aria-hidden="true">
        <div class="launchpad-container" id="launchpadContainer">
            <div class="launchpad-search-bar">
                <svg aria-hidden="true" class="launchpad-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7" />
                    <path d="M21 21l-4.35-4.35" />
                </svg>
                <input type="text" class="launchpad-search-input" id="launchpadSearchInput" data-i18n="searchApps"
                    placeholder="" autocomplete="off">
            </div>
            <div class="launchpad-pages-wrapper">
                <div class="launchpad-pages" id="launchpadPages"></div>
            </div>
            <div class="launchpad-indicator" id="launchpadIndicator"></div>
        </div>
    </div>
    <div class="mac-window-overlay" id="macSettingsOverlay" data-modal="true" role="dialog"
        aria-modal="true" aria-labelledby="macSettingsTitle" aria-hidden="true">
        <div class="mac-window" id="macSettingsWindow">
        </div>
    </div>
    <div class="mac-window-overlay" id="photosOverlay" data-modal="true" role="dialog" aria-modal="true"
        aria-labelledby="photosTitle" aria-hidden="true">
        <div class="mac-window photos-window" id="photosWindow">
        </div>
    </div>
    <div class="engine-switcher-overlay" id="engineSwitcherOverlay" data-modal="true" role="dialog" aria-modal="true"
        data-i18n="ariaSwitchEngine" data-i18n-attr="aria-label" aria-label="" aria-hidden="true">
        <div class="engine-switcher" id="engineSwitcher">
            <div class="engine-switcher-buttons" id="engineSwitcherButtons" role="group">
            </div>
        </div>
    </div>
    <div class="quicklink-dialog-overlay" id="quicklinkDialogOverlay" data-modal="true" role="dialog" aria-modal="true"
        aria-labelledby="quicklinkDialogTitle" aria-hidden="true">
        <div class="quicklink-dialog" id="quicklinkDialog">
            <div class="quicklink-dialog-header">
                <div class="quicklink-dialog-header-start">
                    <div class="quicklink-dialog-header-icon" aria-hidden="true">
                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9.5 14.5 14.5 9.5"/>
                            <path d="m7.25 17.75-1 1a3.536 3.536 0 0 1-5-5l3-3a3.536 3.536 0 0 1 5 0" transform="translate(3)"/>
                            <path d="m16.75 6.25 1-1a3.536 3.536 0 0 1 5 5l-3 3a3.536 3.536 0 0 1-5 0" transform="translate(-3)"/>
                        </svg>
                    </div>
                    <h3 id="quicklinkDialogTitle" data-i18n="dialogAddLink"></h3>
                </div>
                <button class="quicklink-dialog-close" id="quicklinkDialogClose" data-i18n="ariaClose" data-i18n-attr="aria-label" aria-label="">
                    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="quicklink-dialog-content">
                <section class="quicklink-identity-editor">
                    <div class="quicklink-dialog-preview">
                        <div class="quicklink-preview-icon" id="quicklinkPreviewIcon">
                            <span class="preview-fallback">?</span>
                        </div>
                    </div>
                    <div class="quicklink-identity-main">
                        <div class="quicklink-primary-fields">
                            <label class="quicklink-form-label">
                                <span data-i18n="dialogUrl"></span>
                                <div class="quicklink-input-shell">
                                    <svg class="quicklink-input-leading-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                                    <input type="url" id="quicklinkUrlInput" data-i18n="dialogUrlPlaceholder" placeholder="" maxlength="512" autocomplete="url" aria-describedby="quicklinkUrlError">
                                </div>
                                <p class="quicklink-url-error" id="quicklinkUrlError" role="alert" aria-live="polite"></p>
                            </label>
                            <label class="quicklink-form-label">
                                <span data-i18n="dialogTitle"></span>
                                <input type="text" id="quicklinkTitleInput" data-i18n="dialogTitlePlaceholder" placeholder="" maxlength="64">
                            </label>
                        </div>
                        <div class="quicklink-appearance-row">
                            <div class="quicklink-mode-slot">
                                <div class="quicklink-icon-options" data-icon-panel="auto">
                                    <p data-i18n="dialogIconAutoHint"></p>
                                    <div class="quicklink-form-action hidden" id="quicklinkRefreshIconRow">
                                        <button type="button" class="quicklink-btn-text" id="quicklinkRefreshIconBtn">
                                            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-2.636-6.364"/><path d="M21 3v6h-6"/></svg>
                                            <span id="quicklinkRefreshIconLabel" data-i18n="iconCacheRefreshBtn"></span>
                                        </button>
                                    </div>
                                </div>
                                <div class="quicklink-icon-options hidden" data-icon-panel="custom">
                                    <input class="quicklink-mode-input" type="url" id="quicklinkIconInput" data-i18n="dialogCustomIconPlaceholder" placeholder="" maxlength="512" aria-labelledby="quicklinkIconModeCustom">
                                </div>
                                <div class="quicklink-icon-options hidden" data-icon-panel="text">
                                    <input class="quicklink-mode-input" type="text" id="quicklinkIconTextInput" maxlength="8" autocomplete="off" data-i18n="dialogIconText" placeholder="" aria-labelledby="quicklinkIconModeText">
                                    <button class="quicklink-color-well" type="button" id="quicklinkColorWell" data-i18n="dialogIconCustomColor" data-i18n-attr="aria-label" aria-label="">
                                        <span class="quicklink-color-well-swatch" aria-hidden="true"></span>
                                    </button>
                                    <input class="quicklink-native-color-input" type="color" id="quicklinkCustomColorInput" value="#475569" tabindex="-1" aria-hidden="true">
                                </div>
                            </div>
                            <div class="quicklink-icon-mode" id="quicklinkIconMode" role="radiogroup" aria-label="Icon style">
                                <button type="button" data-mode="auto" role="radio" aria-checked="true" data-i18n="dialogIconModeAuto"></button>
                                <button type="button" id="quicklinkIconModeCustom" data-mode="custom" role="radio" aria-checked="false" data-i18n="dialogIconModeCustom"></button>
                                <button type="button" id="quicklinkIconModeText" data-mode="text" role="radio" aria-checked="false" data-i18n="dialogIconModeText"></button>
                            </div>
                        </div>
                    </div>
                </section>
                <section class="quicklink-secondary-fields">
                    <label class="quicklink-form-label">
                        <span><span data-i18n="dialogTags"></span> <small>(<span data-i18n="dialogOptional"></span>)</small></span>
                        <div class="quicklink-tags-wrapper">
                            <div class="quicklink-tags-container" id="quicklinkTagsContainer"></div>
                            <input type="text" id="quicklinkTagsInput" data-i18n="dialogTagsPlaceholder" placeholder="" maxlength="10" autocomplete="off">
                            <div class="quicklink-tags-suggestions" id="quicklinkTagsSuggestions"></div>
                        </div>
                    </label>
                    <label class="quicklink-form-option" for="quicklinkDockCheckbox">
                        <input type="checkbox" id="quicklinkDockCheckbox">
                        <span data-i18n="dialogShowInDock"></span>
                    </label>
                </section>
            </div>
            <div class="quicklink-dialog-footer">
                <button class="quicklink-btn quicklink-btn-secondary hidden" id="quicklinkDeleteBtn" data-i18n="dialogDelete"></button>
                <div class="quicklink-dialog-footer-end">
                    <button class="quicklink-btn quicklink-btn-cancel" id="quicklinkCancelBtn" data-i18n="cancel"></button>
                    <button class="quicklink-btn quicklink-btn-primary" id="quicklinkSaveBtn" data-i18n="dialogSave"></button>
                </div>
            </div>
        </div>
    </div>
    <div class="quicklink-context-menu" id="quicklinkContextMenu" data-modal="true" role="menu" aria-label=""
        aria-hidden="true">
    </div>

    <div class="corner-zone corner-top-left" id="cornerTopLeft">
        <button class="refresh-bg-btn" id="refreshBgBtn" data-i18n="ariaRefreshBg" data-i18n-attr="aria-label"
            aria-label="" tabindex="-1">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 11-2.636-6.364" />
                <path d="M21 3v6h-6" />
            </svg>
        </button>
    </div>
    <div class="corner-zone corner-top-right disabled" id="cornerTopRight">
        <div class="photo-info hidden" id="photoInfo">
            <a class="photo-author" id="photoAuthor" href="#" target="_blank" rel="noopener noreferrer" tabindex="-1">
                <span class="author-prefix" data-i18n="photoByPrefix"></span><span class="author-name"
                    id="authorName"></span>
            </a>
            <button class="favorite-bg-btn" id="favoriteBgBtn" data-i18n="ariaFavorite" data-i18n-attr="aria-label"
                aria-label="" tabindex="-1">
                <svg aria-hidden="true" class="favorite-icon-empty" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" />
                </svg>
                <svg aria-hidden="true" class="favorite-icon-filled hidden" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" />
                </svg>
            </button>
            <button class="download-bg-btn" id="downloadBgBtn" data-i18n="ariaDownloadBg" data-i18n-attr="aria-label"
                aria-label="" tabindex="-1">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
            </button>
        </div>
    </div>
    <div class="corner-zone corner-bottom-left" id="cornerBottomLeft">
        <button class="settings-btn" id="settingsBtn" data-i18n="ariaSettings" data-i18n-attr="aria-label" aria-label=""
            tabindex="-1">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path
                    d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />
            </svg>
        </button>
    </div>
    <div class="corner-zone corner-bottom-right" id="cornerBottomRight">
        <button class="search-toggle-btn" id="searchToggleBtn" data-i18n="ariaSearch" data-i18n-attr="aria-label"
            aria-label="" tabindex="-1">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7" />
                <path d="M21 21l-4.35-4.35" />
            </svg>
        </button>
    </div>
    <script type="module" src="scripts/main.js"></script>
</body>

</html>
